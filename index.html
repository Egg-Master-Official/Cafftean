<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional High-Performance 3D CAD Viewer</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: rgba(30, 30, 30, 0.85);
            --accent-color: #00bcd4;
            --text-color: #ffffff;
            --measure-color: #ffeb3b;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Control Panel */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: var(--panel-bg); width: 320px; padding: 20px;
            border-radius: 12px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        h3 { margin: 0 0 15px 0; color: var(--accent-color); font-size: 1.3rem; letter-spacing: 0.5px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* Custom Upload Button */
        .upload-btn {
            display: block; background: linear-gradient(135deg, #0078d4, #005a9e); text-align: center;
            padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,120,212,0.3); transition: transform 0.1s, background 0.2s;
        }
        .upload-btn:hover { background: linear-gradient(135deg, #0086f0, #0066b3); transform: translateY(-1px); }
        .upload-btn:active { transform: translateY(1px); }
        input[type="file"] { display: none; }
        
        /* Information & Status Panels */
        .status-container { margin-bottom: 15px; font-size: 13px; background: #252525; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .status-row:last-child { margin-bottom: 0; }
        .label { color: #aaa; }
        .value { font-weight: bold; color: #fff; }
        
        /* Measurement Display Box */
        #measure-panel {
            background: #2d2d2d; border-left: 4px solid var(--measure-color);
            padding: 12px; margin-top: 15px; border-radius: 0 6px 6px 0; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        #distance-title { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        #distance-display { font-size: 24px; font-weight: 700; color: var(--measure-color); margin: 5px 0; font-family: monospace; }
        .instructions { font-size: 11px; color: #bbb; line-height: 1.4; }
        
        /* Loading Overlay Spinner */
        #loading-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,15,15,0.8); z-index: 100; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(5px);
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; }
        #progress-text { margin-top: 20px; font-weight: bold; font-size: 16px; color: #fff; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="progress-text">Processing CAD Geometry...</div>
    </div>

    <div id="ui-panel">
        <h3>⚡ Ultra CAD Engine</h3>
        <label class="upload-btn">
            📁 Upload STEP / STP / DXF
            <input type="file" id="cad-file-uploader" accept=".step,.stp,.dxf">
        </label>
        
        <div class="status-container">
            <div class="status-row"><span class="label">File Name:</span><span class="value" id="file-name">-</span></div>
            <div class="status-row"><span class="label">Size:</span><span class="value" id="file-size">-</span></div>
            <div class="status-row"><span class="label">Status:</span><span class="value" id="engine-status" style="color: #4caf50;">Engine Ready</span></div>
        </div>

        <div id="measure-panel">
            <div id="distance-title">📏 Calibrated Distance</div>
            <div id="distance-display">0.000 mm</div>
            <div class="instructions">
                • <b>Rotate/Pan:</b> Mouse Left/Right Click + Drag<br>
                • <b>Measure:</b> Click point A, then click point B. (3rd click resets auto).
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. Advanced Core Engine Architecture & Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202020);

        // Anti-aliased Super-Sampling Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Dynamic capping for 4k performance smoothness
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // Grid Plane Setup (CAD Environment style)
        const grid = new THREE.GridHelper(500, 100, 0x444444, 0x2b2b2b);
        grid.rotation.x = Math.PI / 2;
        scene.add(grid);

        // Professional Perspective Lens Calibration
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 5000);
        camera.position.set(200, 200, 250);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 2000;
        controls.minDistance = 2;

        // Studio Grade High-Dynamic-Range Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(1, 1, 1).normalize();
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x90caf9, 0.4); // Subtle bluish ambient bounce
        dirLight2.position.set(-1, -1, 0.5).normalize();
        scene.add(dirLight2);

        // Memory Registries
        let cadMasterGroup = new THREE.Group();
        scene.add(cadMasterGroup);

        let measurePointsRegistry = [];
        let visualMarkersRegistry = [];
        let runtimeMeasurementLine = null;

        // Max File Threshold: 200 Megabytes
        const MAX_FILE_SIZE_BYTES = 200 * 1024 * 1024; 

        // --- 2. High-Capacity Multi-Format Loader Pipeline ---
        document.getElementById('cad-file-uploader').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Security Validation Check: 200MB Constraint limit
            if (file.size > MAX_FILE_SIZE_BYTES) {
                alert(`File size exceeds 200MB limit. Current file size: ${(file.size / (1024 * 1024)).toFixed(1)}MB`);
                this.value = ''; // Flush input stream
                return;
            }

            // Update DOM Panel State
            document.getElementById('file-name').innerText = file.name.length > 18 ? file.name.substring(0, 15) + '...' : file.name;
            document.getElementById('file-size').innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
            document.getElementById('engine-status').innerText = "Processing...";
            document.getElementById('engine-status').style.color = "#ff9800";
            document.getElementById('loading-overlay').style.display = "flex";
            document.getElementById('progress-text').innerText = `Unpacking ${file.name} to memory module...`;

            // Memory Flush previous mesh nodes to eliminate leak vulnerabilities
            flushEngineMemoryMemory();

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const arrayBuffer = event.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);

                    document.getElementById('progress-text').innerText = "Executing WebAssembly OpenCASCADE Core Engine Engine...";
                    
                    // Fire Up Assembly Compiler Instance
                    const occtContext = await occtimportjs();
                    const parseOutput = occtContext.ReadStepOrDxf(uint8Array, file.name);

                    if (!parseOutput || !parseOutput.success) {
                        throw new Error("Target file structural formatting error or file corrupted.");
                    }

                    document.getElementById('progress-text').innerText = "Generating Smooth Realistic Industrial Textures...";

                    // Build ThreeJS Scene Meshes natively inside browser
                    parseOutput.parts.forEach(part => {
                        const bufferGeom = new THREE.BufferGeometry();
                        
                        // Structural Geometry Binding
                        bufferGeom.setAttribute('position', new THREE.Float32BufferAttribute(part.mesh.attributes.position.array, 3));
                        
                        if(part.mesh.attributes.normal) {
                            bufferGeom.setAttribute('normal', new THREE.Float32BufferAttribute(part.mesh.attributes.normal.array, 3));
                        } else {
                            bufferGeom.computeVertexNormals();
                        }

                        if(part.mesh.index) {
                            bufferGeom.setIndex(new THREE.BufferAttribute(new Uint32Array(part.mesh.index.array), 1));
                        }

                        // Premium Steel Coating Shader Node logic (Auto Extracts color metadata if embedded)
                        const partColorHex = part.color ? 
                            new THREE.Color(`rgb(${Math.round(part.color[0]*255)}, ${Math.round(part.color[1]*255)}, ${Math.round(part.color[2]*255)})`) : 
                            new THREE.Color('#b0bec5');

                        const precisionIndustrialMaterial = new THREE.MeshStandardMaterial({
                            color: partColorHex,
                            roughness: 0.18, // Ultra realistic light glare reflection
                            metalness: 0.75, // Chrome steel finishing aesthetics
                            side: THREE.DoubleSide
                        });

                        const meshInstance = new THREE.Mesh(bufferGeom, precisionIndustrialMaterial);
                        cadMasterGroup.add(meshInstance);
                    });

                    // Auto Adaptive Matrix Centering Engine
                    const structuralBoundBox = new THREE.Box3().setFromObject(cadMasterGroup);
                    const geometryCenterVector = new THREE.Vector3();
                    structuralBoundBox.getCenter(geometryCenterVector);
                    cadMasterGroup.position.sub(geometryCenterVector); // Offset shift directly into system center origin

                    // Macro Scale Dynamic Zoom Tuning Engine
                    const dimensions = structuralBoundBox.getSize(new THREE.Vector3());
                    const majorAxisDim = Math.max(dimensions.x, dimensions.y, dimensions.z);
                    
                    camera.position.set(majorAxisDim * 1.4, majorAxisDim * 1.4, majorAxisDim * 1.4);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    document.getElementById('engine-status').innerText = "Render Smooth";
                    document.getElementById('engine-status').style.color = "#4caf50";

                } catch (runtimeException) {
                    console.error(runtimeException);
                    alert("Processing Error: File execution failed. Ensure it is uncorrupted.");
                    document.getElementById('engine-status').innerText = "Execution Broken";
                    document.getElementById('engine-status').style.color = "#f44336";
                } finally {
                    document.getElementById('loading-overlay').style.display = "none";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // --- 3. Ultra-Fast Precision Surface Raycaster Measurement System ---
        const mathematicalRaycaster = new THREE.Raycaster();
        const screenMouseCoordinate = new THREE.Vector2();

        window.addEventListener('pointerdown', function(mouseClickEvent) {
            // Filter click events safely away from Control Panel Interfaces bounding coordinates
            if (mouseClickEvent.clientX < 360 && mouseClickEvent.clientY < 320) return;

            // Mapping 2D Pixel Screens coordinates to standard cartesian 3D Matrix WebGL planes
            screenMouseCoordinate.x = (mouseClickEvent.clientX / window.innerWidth) * 2 - 1;
            screenMouseCoordinate.y = -(mouseClickEvent.clientY / window.innerHeight) * 2 + 1;

            mathematicalRaycaster.setFromCamera(screenMouseCoordinate, camera);
            const intersectionsGroup = mathematicalRaycaster.intersectObjects(cadMasterGroup.children, true);

            if (intersectionsGroup.length > 0) {
                const specificSurfaceHitPoint = intersectionsGroup[0].point;

                // Safe State Machine Reset Routine if 3rd execution point is flagged
                if (measurePointsRegistry.length >= 2) {
                    clearActiveMeasurements();
                }

                measurePointsRegistry.push(specificSurfaceHitPoint);

                // High Visibility Laser Nodes deployment on surface coordinate geometry
                const markerNodeGeometry = new THREE.SphereGeometry(majorDimensionScanner() * 0.008 || 1.2, 16, 16);
                const markerNodeMaterial = new THREE.MeshBasicMaterial({ color: 0xffeb3b, depthTest: false, transparent: true, opacity: 0.9 });
                const visualMarkerMesh = new THREE.Mesh(markerNodeGeometry, markerNodeMaterial);
                visualMarkerMesh.position.copy(specificSurfaceHitPoint);
                scene.add(visualMarkerMesh);
                visualMarkersRegistry.push(visualMarkerMesh);

                // Compute exact Euclidean matrix tracking vector points distance separation 
                if (measurePointsRegistry.length === 2) {
                    const finalCalculatedDistance = measurePointsRegistry[0].distanceTo(measurePointsRegistry[1]);
                    document.getElementById('distance-display').innerText = `${finalCalculatedDistance.toFixed(3)} mm`;

                    // Deploy dynamic direct visual laser connection vector string
                    const dynamicLaserPathGeometry = new THREE.BufferGeometry().setFromPoints([measurePointsRegistry[0], measurePointsRegistry[1]]);
                    const dynamicLaserMaterial = new THREE.LineBasicMaterial({ color: 0xffeb3b, linewidth: 4, depthTest: false });
                    runtimeMeasurementLine = new THREE.Line(dynamicLaserPathGeometry, dynamicLaserMaterial);
                    scene.add(runtimeMeasurementLine);
                }
            }
        });

        // Helper tracking module to auto adjust measurement point sizes dynamically based on 3D Scale
        function majorDimensionScanner() {
            const tempBox = new THREE.Box3().setFromObject(cadMasterGroup);
            const tempSize = tempBox.getSize(new THREE.Vector3());
            return Math.max(tempSize.x, tempSize.y, tempSize.z);
        }

        function clearActiveMeasurements() {
            measurePointsRegistry = [];
            visualMarkersRegistry.forEach(node => scene.remove(node));
            visualMarkersRegistry = [];
            if (runtimeMeasurementLine) {
                scene.remove(runtimeMeasurementLine);
                runtimeMeasurementLine = null;
            }
            document.getElementById('distance-display').innerText = "0.000 mm";
        }

        function flushEngineMemoryMemory() {
            clearActiveMeasurements();
            while(cadMasterGroup.children.length > 0) {
                const nodeObject = cadMasterGroup.children[0];
                nodeObject.geometry.dispose();
                if(Array.isArray(nodeObject.material)) {
                    nodeObject.material.forEach(m => m.dispose());
                } else {
                    nodeObject.material.dispose();
                }
                cadMasterGroup.remove(nodeObject);
            }
        }

        // --- 4. Synchronized Performance Rendering Engine loop & Resize Drivers ---
        function coreRenderingLoop() {
            requestAnimationFrame(coreRenderingLoop);
            controls.update(); // Smooth damp mechanics tracking engine execution
            renderer.render(scene, camera);
        }
        coreRenderingLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
